<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keep It Up!</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        background: radial-gradient(circle at top, #26366b, #101426 65%);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: 40px 28px;
        text-align: center;
        background: rgb(255 255 255 / 8%);
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #a5b4fc;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .instructions {
        margin: 12px 0 28px;
        color: #cbd5e1;
      }

      .time-label {
        margin: 0;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      #count {
        margin: 0;
        font-size: clamp(5rem, 25vw, 8rem);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      #status {
        min-height: 1.5em;
        margin: 12px 0 24px;
        color: #a5b4fc;
        font-weight: 600;
      }

      button {
        width: min(100%, 280px);
        min-height: 76px;
        border: 0;
        border-radius: 20px;
        color: #1e1b4b;
        background: linear-gradient(135deg, #c4b5fd, #818cf8);
        box-shadow: 0 8px 0 #4f46e5, 0 14px 28px rgb(0 0 0 / 25%);
        cursor: pointer;
        font: inherit;
        font-size: 1.25rem;
        font-weight: 800;
        transition: transform 100ms ease, filter 100ms ease;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      button:active:not(:disabled) {
        transform: translateY(5px);
        box-shadow: 0 3px 0 #4f46e5, 0 8px 18px rgb(0 0 0 / 25%);
      }

      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 5px;
      }

      button:disabled {
        cursor: not-allowed;
        filter: grayscale(0.7);
        opacity: 0.65;
      }

      #restart {
        min-height: 48px;
        margin-top: 24px;
        color: #f8fafc;
        background: transparent;
        border: 1px solid rgb(255 255 255 / 30%);
        box-shadow: none;
        font-size: 1rem;
      }

      #restart:hover {
        background: rgb(255 255 255 / 10%);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Quick challenge</p>
      <h1>Keep It Up!</h1>
      <p class="instructions">Click the button before the counter hits zero!</p>
      <p class="time-label">TIME LEFT</p>
      <p id="count" aria-live="polite">10</p>
      <p id="status" role="status">Ready? Keep clicking!</p>
      <button id="click-button" type="button">CLICK TO ADD TIME</button>
      <button id="restart" type="button" hidden>Play again</button>
    </main>

    <script>
      const startingTime = 10;
      let timeLeft = startingTime;
      let timerId;

      const countDisplay = document.getElementById("count");
      const statusDisplay = document.getElementById("status");
      const clickButton = document.getElementById("click-button");
      const restartButton = document.getElementById("restart");

      function finishGame() {
        window.clearInterval(timerId);
        clickButton.disabled = true;
        restartButton.hidden = false;
        statusDisplay.textContent = "Time's up! Play again?";
      }

      function updateDisplay() {
        countDisplay.textContent = timeLeft;
      }

      function startGame() {
        window.clearInterval(timerId);
        timeLeft = startingTime;
        updateDisplay();
        clickButton.disabled = false;
        restartButton.hidden = true;
        statusDisplay.textContent = "Ready? Keep clicking!";

        timerId = window.setInterval(() => {
          timeLeft -= 1;
          updateDisplay();

          if (timeLeft <= 0) {
            timeLeft = 0;
            updateDisplay();
            finishGame();
          }
        }, 1000);
      }

      clickButton.addEventListener("click", () => {
        if (timeLeft > 0) {
          timeLeft += 1;
          updateDisplay();
          statusDisplay.textContent = "Nice! Keep going!";
        }
      });

      restartButton.addEventListener("click", startGame);
      startGame();
    </script>
  </body>
</html>
