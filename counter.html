<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Counter</title>
  </head>
  <body>
    <h1>Counter</h1>
    <p id="count">0</p>
    <button onclick="increase()">Add one</button>

    <script>
      let count = 0;

      function increase() {
        count += 1;
        document.getElementById("count").textContent = count;
      }
    </script>
  </body>
</html>
